:root{--fg:#58001B;--fg-hover:#6E0A2A;--rose:#FAF4F6;--line:#EADDE1;--line2:#F2E8EB;--ink:#1F1F1F;--ink2:#3B3538;--lgrey:#8A8485;--bg:#FBF8F9;--bad:#b91c1c;--bad-bg:#fef2f2;
--head:'Obviously','Helvetica Neue',Helvetica,Arial,sans-serif;--body:'Helvetica Neue',Helvetica,'Inter',-apple-system,'Segoe UI',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:12.5px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--fg);border-radius:6px;padding:28px 28px 24px;box-shadow:0 12px 32px rgba(88,0,27,.08)}
.card img{height:22px;width:auto;display:block}
h1{margin:22px 0 4px;font-family:var(--head);font-weight:300;color:var(--fg);font-size:13px;letter-spacing:2px;text-transform:uppercase}
p{margin:0 0 20px;color:var(--lgrey);font-size:12px}
form{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:5px;font-size:9.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--fg)}
input{font:inherit;font-size:13px;letter-spacing:0;text-transform:none;background:#fff;border:1px solid var(--line);border-radius:3px;padding:9px 11px;color:var(--ink);outline:none}
input:focus{border-color:var(--fg);box-shadow:0 0 0 3px rgba(88,0,27,.07)}
button{margin-top:4px;height:40px;border:1px solid var(--fg);background:var(--fg);color:#fff;border-radius:3px;font:600 10.5px var(--body);letter-spacing:1.4px;text-transform:uppercase;cursor:pointer}
button:hover{background:var(--fg-hover)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.err{display:none;background:var(--bad-bg);border-left:2px solid var(--bad);color:#991b1b;padding:9px 12px;font-size:12px;border-radius:0 3px 3px 0}
.err.on{display:block}
.foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line2);color:var(--lgrey);font-size:10px;letter-spacing:.6px;text-transform:uppercase}
</style>
</head>

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function unlock(profile,pw){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(profile.trim().toUpperCase()+'\n'+pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var err=document.getElementById('err'),go=document.getElementById('go');
  err.className='err';go.disabled=true;go.textContent='Opening…';
  if(!window.crypto||!crypto.subtle){err.textContent='This browser cannot decrypt the tool. Open the page over https (GitHub Pages) in Chrome, Edge, Safari or Firefox.';err.className='err on';go.disabled=false;go.textContent='Sign in';return;}
  try{
    var html=await unlock(document.getElementById('u').value,document.getElementById('pw').value);
    document.open();document.write(html);document.close();
  }catch(x){
    err.textContent='Profile or password is not correct.';err.className='err on';go.disabled=false;go.textContent='Sign in';document.getElementById('pw').select();
  }
});
